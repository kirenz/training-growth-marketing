# Fiktive Unternehmenswebsite von Aurenta für den Übungsfall.
# Eigenständiges Quarto-Teilprojekt, rendert nach ../_site/aurenta/.
# Rendern: quarto render (in diesem Ordner) oder quarto render aurenta (im Projektordner).
project:
  type: website
  output-dir: ../_site/aurenta
  render:
    - index.qmd
    - praxischeck.qmd
    - webinar.qmd
    - fachbeitrag.qmd
    - erstgespraech.qmd

lang: de

website:
  title: "Aurenta"
  description: "KI-Beratung für Marketingabteilungen (fiktives Unternehmen, Lehrbeispiel)"
  page-navigation: false
  navbar:
    background: light
    pinned: true
    left:
      - href: index.qmd
        text: Start
      - href: praxischeck.qmd
        text: KI-Praxischeck
      - href: webinar.qmd
        text: Webinar
      - href: fachbeitrag.qmd
        text: Fachbeitrag
    right:
      - href: erstgespraech.qmd
        text: Erstgespräch
  page-footer:
    border: true
    left: |
      Aurenta ist ein fiktives Unternehmen für die Vorlesung „Agentic AI für Growth Marketing“ an der HdM Stuttgart. Alle Angaben sind synthetisch.
    right: |
      [Zur Kursseite](../index.html)

format:
  html:
    include-in-header:
      - ../passwortschutz.html
    theme: [cosmo, aurenta.scss]
    toc: false
    anchor-sections: false
