```{=html}

  <div class="gm-sim__controls">
    <label>Kontakte pro Variante <span id="gm-sim-n-val">100</span>

  <table class="gm-sim__table">

      <tr><td>A: Kontrollgruppe, bisherige Einladung</td><td id="gm-a-yes">–</td><td id="gm-a-no">–</td><td id="gm-a-n">–</td></tr>
      <tr><td>B: Treatment-Gruppe, nach Anliegen</td><td id="gm-b-yes">–</td><td id="gm-b-no">–</td><td id="gm-b-n">–</td></tr>

  <div class="gm-sim__tally" id="gm-sim-tally"></div>
</div>
<style>

</style>
<script>
(function () {
  var nEl = document.getElementById("gm-sim-n"), pEl = document.getElementById("gm-sim-p");
  var runs = 0, bWins = 0, aWins = 0, ties = 0, view = "abs", last = null;
  function fmt(x) { return x.toFixed(1).replace(".", ",") + " %"; }
  function binom(n, p) { var k = 0; for (var i = 0; i < n; i++) if (Math.random() < p) k++; return k; }
  function set(id, v) { document.getElementById(id).textContent = v; }
  function updateLabels() {
    set("gm-sim-n-val", nEl.value);
    set("gm-sim-p-val", pEl.value + " %");
  }
  function resetTally() {
    runs = bWins = aWins = ties = 0;
    document.getElementById("gm-sim-tally").textContent = "";
  }
  function pct(x, d) { return d ? fmt(100 * x / d) : "–"; }
  function renderTable() {
    if (!last) return;
    var n = last.n, a = last.a, b = last.b, ty = a + b, tn = 2 * n - ty, N = 2 * n;
    var q = document.getElementById("gm-sim-question");
    if (view === "abs") {
      set("gm-a-yes", a); set("gm-a-no", n - a); set("gm-a-n", n);
      set("gm-b-yes", b); set("gm-b-no", n - b); set("gm-b-n", n);
      set("gm-t-yes", ty); set("gm-t-no", tn); set("gm-t-n", N);
      q.textContent = "Absolute Werte: Anzahl der Kontakte je Zelle.";
    } else if (view === "row") {
      set("gm-a-yes", pct(a, n)); set("gm-a-no", pct(n - a, n)); set("gm-a-n", "100 %");
      set("gm-b-yes", pct(b, n)); set("gm-b-no", pct(n - b, n)); set("gm-b-n", "100 %");
      set("gm-t-yes", pct(ty, N)); set("gm-t-no", pct(tn, N)); set("gm-t-n", "100 %");
      q.textContent = "Zeilenanteile: Wie viele der Kontakte in Gruppe B führten ein Gespräch? Das ist die Gesprächsquote, die verglichen wird.";
    } else {
      set("gm-a-yes", pct(a, ty)); set("gm-a-no", pct(n - a, tn)); set("gm-a-n", pct(n, N));
      set("gm-b-yes", pct(b, ty)); set("gm-b-no", pct(n - b, tn)); set("gm-b-n", pct(n, N));
      set("gm-t-yes", "100 %"); set("gm-t-no", "100 %"); set("gm-t-n", "100 %");
      q.textContent = "Spaltenanteile: Wie viele der geführten Gespräche kamen aus Gruppe B? Eine andere Frage, nicht die Gesprächsquote.";
    }
  }
  function run() {
    var n = parseInt(nEl.value, 10), pB = parseInt(pEl.value, 10) / 100, pA = 0.05;
    var a = binom(n, pA), b = binom(n, pB);
    last = { n: n, a: a, b: b }; renderTable();
    runs++;
    var diff = 100 * (b - a) / n, txt;
    if (b > a) { bWins++; txt = "<strong>B liegt vorn</strong>: " + b + " gegen " + a + " Gespräche, Gesprächsquote " + fmt(100 * b / n) + " gegen " + fmt(100 * a / n) + "."; }
    else if (a > b) { aWins++; txt = "<span class='is-warn'>A liegt vorn</span>: " + a + " gegen " + b + " Gespräche, obwohl B die höhere wahre Quote hat."; }
    else { ties++; txt = "Gleichstand: " + a + " gegen " + b + " Gespräche."; }
    document.getElementById("gm-sim-result").innerHTML = txt + " Wahre Quoten: A 5 %, B " + pEl.value + " %. Ist der Unterschied zwischen den beiden Stichproben groß genug, um auf alle Kontakte zu schließen? Das ist die Inferenz-Frage, die ein statistischer Test beantwortet.";
    document.getElementById("gm-sim-tally").textContent = "Durchläufe: " + runs + " · B vorn: " + bWins + " · A vorn: " + aWins + " · gleich: " + ties;
  }
  nEl.addEventListener("input", function () { updateLabels(); resetTally(); });
  pEl.addEventListener("input", function () { updateLabels(); resetTally(); });
  document.getElementById("gm-sim-run").addEventListener("click", run);
  document.getElementById("gm-sim-reset").addEventListener("click", function () {
    resetTally();
    last = null; ["gm-a-yes","gm-a-no","gm-a-n","gm-b-yes","gm-b-no","gm-b-n","gm-t-yes","gm-t-no","gm-t-n"].forEach(function (id) { set(id, "–"); }); document.getElementById("gm-sim-question").textContent = "";
    document.getElementById("gm-sim-result").textContent = "Noch kein Durchlauf.";
  });
  document.getElementById("gm-sim-view").addEventListener("click", function (ev) { var b = ev.target.closest("button"); if (!b) return; view = b.dataset.v; Array.prototype.forEach.call(ev.currentTarget.children, function (x) { x.className = x === b ? "is-on" : ""; }); renderTable(); });
  updateLabels();
})();
</script>
