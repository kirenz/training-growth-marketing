<section id="$idprefix$title-slide"$for(title-slide-attributes/pairs)$ $it.key$="$it.value$"$endfor$>
  <!-- Animierter Hintergrund (nur Dekoration, kein Inhalt) -->
  <div class="animated-background">
    <div class="particle particle-1"></div>
    <div class="particle particle-2"></div>
    <div class="particle particle-3"></div>
    <div class="particle particle-4"></div>
    <div class="particle particle-5"></div>
    <div class="particle particle-6"></div>
    <div class="particle particle-7"></div>
    <div class="particle particle-8"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>

    <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;">
      <line x1="15%" y1="10%" x2="45%" y2="30%" stroke="rgba(75, 169, 255, 0.15)" stroke-width="1" />
      <line x1="45%" y1="30%" x2="25%" y2="60%" stroke="rgba(189, 140, 255, 0.15)" stroke-width="1" />
      <line x1="25%" y1="60%" x2="60%" y2="55%" stroke="rgba(183, 247, 91, 0.15)" stroke-width="1" />
      <line x1="60%" y1="55%" x2="85%" y2="40%" stroke="rgba(255, 120, 71, 0.15)" stroke-width="1" />
      <line x1="15%" y1="10%" x2="85%" y2="20%" stroke="rgba(75, 169, 255, 0.12)" stroke-width="1" />
      <line x1="45%" y1="30%" x2="75%" y2="65%" stroke="rgba(189, 140, 255, 0.12)" stroke-width="1" />
      <line x1="25%" y1="60%" x2="35%" y2="70%" stroke="rgba(183, 247, 91, 0.12)" stroke-width="1" />
      <line x1="85%" y1="20%" x2="75%" y2="65%" stroke="rgba(75, 169, 255, 0.12)" stroke-width="1" />
    </svg>
  </div>

  <div class="title-term">WS 2026/27</div>
  <h1 class="title">$title$</h1>
  <div class="subtitle-container">
    <span class="subtitle-button">$subtitle$</span>
  </div>
  <div class="title-meta">$author$</div>
</section>
